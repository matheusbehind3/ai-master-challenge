<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar de Pipeline — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14161a;--muted:#646b76;--line:#e4e7ec;--soft:#f0f2f5;
  --brand:#2f5bea;--brand-soft:#e8eefd;
  --ok:#1f9d55;--ok-soft:#e5f5ec;--warn:#c27c0e;--warn-soft:#fdf3e1;--hot:#d6452c;--hot-soft:#fdeae6;--zombie:#6b5fa8;--zombie-soft:#efedf8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,select{font:inherit}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px;background:var(--brand);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:6px;border:2px solid #fff;border-radius:50%}
.ctx{font-size:12px;color:var(--muted);background:var(--soft);padding:4px 10px;border-radius:99px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{max-width:1180px;margin:0 auto;padding:0 20px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;min-width:150px}
.log{margin-left:auto;font-size:12px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.brief{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.brief ol{margin:6px 0 0;padding-left:20px}.brief li{margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:22px;margin-top:2px}.kpi span{font-size:12px;color:var(--muted)}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.tabs .n{background:var(--soft);border-radius:99px;padding:1px 7px;font-size:11px;margin-left:4px}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.deal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start}
.deal.done{opacity:.45}
.score{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:var(--brand)}
.score.z{background:var(--zombie)}.score small{display:block;font-size:9px;font-weight:500;opacity:.85;margin-top:-4px}
.ttl{font-weight:600;font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:1px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:4px}
.c-saudavel{background:var(--ok-soft);color:var(--ok)}.c-esfriando{background:var(--warn-soft);color:var(--warn)}
.c-ultima{background:var(--hot-soft);color:var(--hot)}.c-zumbi{background:var(--zombie-soft);color:var(--zombie)}
.c-pros{background:var(--brand-soft);color:var(--brand)}
.clockbar{position:relative;height:8px;background:linear-gradient(90deg,var(--ok-soft) 0 65.2%,var(--warn-soft) 65.2% 87%,var(--hot-soft) 87% 100%);border-radius:99px;margin:10px 0 4px;max-width:420px}
.clockbar .pin{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2);transform:translateX(-50%)}
.clocklbl{position:relative;height:14px;max-width:420px;font-size:10px;color:var(--muted)}.clocklbl span{position:absolute;transform:translateX(-50%)}.clocklbl span:first-child{transform:none}
.why{font-size:13px;margin-top:8px}
.why .pt{display:inline-block;min-width:34px;font-weight:600;color:var(--brand)}
.act{font-size:13px;margin-top:8px;font-weight:500}
.alert{font-size:12px;margin-top:8px;background:var(--warn-soft);color:#7a4d07;border-radius:8px;padding:6px 10px}
.alert.info{background:var(--soft);color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:6px;min-width:150px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;font-weight:500;text-align:left}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{opacity:.9;color:#fff}
.decided{font-size:12px;font-weight:600;color:var(--ok)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#fafbfc;font-weight:600}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#f7f9ff}
.mini{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:60px}
.mini i{display:block;height:100%;background:var(--zombie)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 10px;font-size:14px}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;font-size:12px;margin:6px 0}
.hbar .t{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}.hbar .t i{display:block;height:100%;background:#b8c4d6}
.hbar.me .t i{background:var(--brand)}.hbar.me{font-weight:600}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14161a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.more{display:block;margin:10px auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.deal{grid-template-columns:52px 1fr}.btns{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.grid2{grid-template-columns:1fr}.seg{margin-left:0}.hbar{grid-template-columns:110px 1fr 70px}}
</style>
</head>

</div>

const $ = s => document.querySelector(s);
const usd = v => 'US$ ' + Math.round(v).toLocaleString('pt-BR');
const usdk = v => v >= 1e6 ? 'US$ ' + (v/1e6).toFixed(2).replace('.',',') + ' mi' : v >= 1e3 ? 'US$ ' + Math.round(v/1e3) + ' mil' : usd(v);
const CLK = {saudavel:'Saudável',esfriando:'Esfriando',ultima:'Última chance',zumbi:'Zumbi'};
const CLKCOL = {saudavel:'var(--ok)',esfriando:'var(--warn)',ultima:'var(--hot)',zumbi:'var(--zombie)'};
const st = {role:'vend', of:'', mg:'', ag:'Rosalina Dieter', tab:'foco', decisions:{}, show:20};

$('#ctx').textContent = 'Hoje: 31/12/2017 · último dia do 4º trimestre';

// ---------- filtros ----------
const team = DATA.team;
function opts(sel, values, cur, all){ sel.innerHTML = (all?`<option value="">${all}</option>`:'') + values.map(v=>`<option ${v===cur?'selected':''}>${v}</option>`).join(''); }
function refreshFilters(){
  const offices=[...new Set(team.map(t=>t.regional_office))];
  opts($('#fOf'), offices, st.of, 'Todos');
  const mgs=[...new Set(team.filter(t=>!st.of||t.regional_office===st.of).map(t=>t.manager))];
  if(st.mg && !mgs.includes(st.mg)) st.mg='';
  opts($('#fMg'), mgs, st.mg, 'Todos');
  const ags=team.filter(t=>(!st.of||t.regional_office===st.of)&&(!st.mg||t.manager===st.mg)).map(t=>t.sales_agent);
  if(!ags.includes(st.ag)) st.ag=ags[0];
  opts($('#fAg'), ags, st.ag);
  $('#lAg').style.display = st.role==='vend' ? '' : 'none';
  $('#filters').style.display = st.role==='conf' ? 'none' : '';
}
$('#fOf').onchange=e=>{st.of=e.target.value;st.mg='';render()};
$('#fMg').onchange=e=>{st.mg=e.target.value;render()};
$('#fAg').onchange=e=>{st.ag=e.target.value;st.tab='foco';st.show=20;render()};
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>{st.role=b.dataset.r;document.querySelectorAll('#roles button').forEach(x=>x.classList.toggle('on',x===b));render()});

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function decide(id,label){st.decisions[id]=label;const n=Object.keys(st.decisions).length;$('#log').textContent=n+(n===1?' decisão registrada':' decisões registradas')+' · viram dado de atividade';toast('Registrado: '+label);render()}
window.decide=decide;

// ---------- card de deal ----------
function clockBar(d){
  const pos=Math.min(d.age,150)/150*100;
  return `<div class="clockbar" style="background:linear-gradient(90deg,var(--ok-soft) 0 60%,var(--warn-soft) 60% 80%,var(--hot-soft) 80% 92%,var(--zombie-soft) 92% 100%)"><span class="pin" style="left:${pos}%;background:${CLKCOL[d.clock]}"></span></div>
  <div class="clocklbl"><span style="left:0">0</span><span style="left:60%">90d</span><span style="left:80%">120</span><span style="left:92%">138</span></div>`;
}
function action(d){
  if(!d.acc) return '🔗 Vincule a conta no CRM — sem ela não dá para ver setor nem conflitos.';
  return '';
}
function card(d){
  const done=st.decisions[d.id];
  const conf=d.conf.length?`<div class="alert">⚠ ${d.conf.length===1?'Outro vendedor também está':'Outros '+d.conf.length+' vendedores também estão'} oferecendo ${d.prod} para ${d.acc}: ${d.conf.slice(0,3).join(', ')}${d.conf.length>3?'…':''}. Combinem quem segue — a ferramenta não bloqueia (há casos em que os dois ganharam).</div>`:'';
  const noacc=!d.acc?`<div class="alert info">🔗 Deal sem conta vinculada no CRM — vincule para ver setor e possíveis conflitos.</div>`:'';
  let left, body, btns;
  if(d.stage==='Prospecting'){
    left=`<div class="score" style="background:#9aa6b8">—</div>`;
    body=`<div class="ttl">${d.prod} · ${d.acc||'Conta não vinculada'}</div>
      <div class="meta"><span class="chip c-pros">Prospecting</span>${usd(d.price)} · sem data de engajamento</div>
      <div class="why">Sem data no CRM, não dá para medir o relógio. Ordenado só pelo valor.</div>
      <div class="act">▶ Próximo passo: fazer o primeiro contato e registrar a data de engajamento.</div>${conf}${noacc}`;
    btns=`<button class="btn pri" onclick="decide('${d.id}','Iniciado')">Iniciar contato</button><button class="btn" onclick="decide('${d.id}','Descartado')">Descartar</button>`;
  } else if(d.clock==='zumbi'){
    left=`<div class="score z">0<small>zumbi</small></div>`;
    body=`<div class="ttl">${d.prod} · ${d.acc||'Conta não vinculada'}</div>
      <div class="meta"><span class="chip c-zumbi">Zumbi · ${d.age} dias</span>${usd(d.price)}</div>
      ${clockBar(d)}
      <div class="why">Nenhum deal desta empresa fechou depois de 138 dias — e no teste histórico, <b>0 de 264</b> deals nessa idade ganharam nos 90 dias seguintes.</div>
      <div class="act">▶ Decida: se você tem um contato ativo, mantenha (e registre o motivo). Se não, marque como perdido e libere o pipeline.</div>${conf}${noacc}`;
    btns=`<button class="btn" onclick="decide('${d.id}','Mantido vivo (com motivo)')">Está vivo — manter</button><button class="btn pri" onclick="decide('${d.id}','Marcado como perdido')">Marcar como perdido</button>`;
  } else {
    const pct=Math.round(d.p*100);
    const nextTxt={saudavel:`▶ Avançar: agende o próximo passo. Deals nessa idade fecham ${pct}% das vezes em 90 dias.`,
      esfriando:`▶ Acelerar: a chance está caindo (${pct}% em 90 dias). Faltam ${138-d.age} dias para o limite em que nenhum deal fechou.`,
      ultima:`▶ Decidir agora: só ${pct}% de chance e ${138-d.age>0?'faltam '+(138-d.age)+' dias':'hoje é o último dia'} antes de virar zumbi.`}[d.clock];
    left=`<div class="score">${d.score}<small>score</small></div>`;
    body=`<div class="ttl">${d.prod} · ${d.acc||'Conta não vinculada'}</div>
      <div class="meta"><span class="chip c-${d.clock}">${CLK[d.clock]} · ${d.age} dias</span>${usd(d.price)}${d.sec?' · '+d.sec:''}</div>
      ${clockBar(d)}
      <div class="why"><b>Por que ${d.score}:</b> <span class="pt">+${d.sv}</span>valor (${usd(d.price)}) · <span class="pt">+${d.sm}</span>momento (${d.age} dias → ${pct}% de chance em 90 dias)</div>
      <div class="act">${nextTxt}</div>${conf}${noacc}`;
    btns=`<button class="btn pri" onclick="decide('${d.id}','Próximo passo agendado')">Agendei o próximo passo</button>${d.conf.length?`<button class="btn" onclick="decide('${d.id}','Combinado com colega')">Combinei com o colega</button>`:''}<button class="btn" onclick="decide('${d.id}','Marcado como perdido')">Marcar como perdido</button>`;
  }
  return `<div class="deal ${done?'done':''}">${left}<div>${body}</div><div class="btns">${done?`<span class="decided">✓ ${done}</span>`:btns}</div></div>`;
}

// ---------- visão vendedor ----------
function vendedor(){
  const mine=DATA.deals.filter(d=>d.ag===st.ag);
  const prof=DATA.prof[st.ag];
  const alive=mine.filter(d=>d.stage==='Engaging'&&d.clock!=='zumbi').sort((a,b)=>b.score-a.score||b.price-a.price);
  const zomb=mine.filter(d=>d.clock==='zumbi').sort((a,b)=>b.price-a.price);
  const pros=mine.filter(d=>d.stage==='Prospecting').sort((a,b)=>b.price-a.price);
  const conf=mine.filter(d=>d.conf.length&&d.clock!=='zumbi');
  const second=DATA.second.filter(s=>s.ag===st.ag).sort((a,b)=>b.price-a.price);
  const ev=alive.reduce((s,d)=>s+d.ev,0);
  const first=st.ag.split(' ')[0];
  if(!mine.length && !prof){
    return `<h1>${st.ag}</h1><p class="sub">Este vendedor está cadastrado na equipe mas não tem nenhuma oportunidade no CRM.</p>
    <div class="hint">É capacidade ociosa: um bom uso seria assumir a revisão de zumbis da equipe ou a lista de Segunda chance.</div>`;
  }
  const items=[];
  const hot=alive.filter(d=>d.clock!=='saudavel').sort((a,b)=>b.price-a.price)[0];
  const left=d=>138-d.age>0?`faltam ${138-d.age} dias para o limite de 138 dias`:`hoje é o último dia antes do limite de 138 dias`;
  const weak=!alive.length||alive[0].ev<300;
  if(alive.length&&!weak) items.push(`Comece por <b>${alive[0].prod}${alive[0].acc?' na '+alive[0].acc:''}</b> (score ${alive[0].score}, ${usd(alive[0].price)}).`);
  if(weak&&pros.length) items.push(`Seu pipeline vivo está nos <b>${pros.length} prospects</b> (${usdk(pros.reduce((s,d)=>s+d.price,0))}). Comece pelo maior: <b>${pros[0].prod}${pros[0].acc?' na '+pros[0].acc:''}</b> (${usd(pros[0].price)}).`);
  if(hot && !weak && hot.id!==alive[0].id) items.push(`<b>${hot.prod}${hot.acc?' na '+hot.acc:''}</b> está na fase "${CLK[hot.clock].toLowerCase()}": ${left(hot)}.`);
  else if(hot && !weak) items.push(`Ele está na fase "${CLK[hot.clock].toLowerCase()}": ${left(hot)}.`);
  if(zomb.length) items.push(`<b>${zomb.length} zumbis</b> (${usdk(zomb.reduce((s,d)=>s+d.price,0))}) esperam sua decisão: manter ou encerrar.`);
  if(conf.length) items.push(`<b>${conf.length} deal${conf.length>1?'s':''}</b> com colega na mesma conta e produto — vale combinar quem segue.`);
  const tabs=[['foco','Foco da semana',Math.min(10,alive.length+pros.length)],['vivos','Todos os vivos',alive.length],['zumbis','Zumbis para revisar',zomb.length],['second','Segunda chance',second.length],['pros','Prospecting',pros.length]].filter(t=>t[2]||t[0]==='foco');
  if(!tabs.find(t=>t[0]===st.tab)) st.tab=tabs[0][0];
  let list='', hint='';
  if(st.tab==='foco'){const f=alive.slice(0,10);list=f.map(card).join('');
    if(f.length<10&&pros.length) list+=`<h2>Para completar sua semana: prospects de maior valor</h2>`+pros.slice(0,10-f.length).map(card).join('');
    if(!list) list='<div class="hint">Sem deals vivos.</div>';hint='Os 10 deals com maior valor esperado (valor × chance de ganhar em 90 dias pela idade). No teste histórico, focar assim trouxe 2,7× mais receita que escolher no feeling.';}
  if(st.tab==='vivos'){list=alive.slice(0,st.show).map(card).join('')+(alive.length>st.show?`<button class="more" onclick="st.show+=20;render()">Mostrar mais</button>`:'');}
  if(st.tab==='zumbis'){list=zomb.slice(0,st.show).map(card).join('')+(zomb.length>st.show?`<button class="more" onclick="st.show+=20;render()">Mostrar mais</button>`:'');hint='Deals com mais de 138 dias. A ferramenta não encerra nada sozinha: o CRM não registra suas ligações e reuniões, então quem sabe se o deal está vivo é você.';}
  if(st.tab==='pros'){list=pros.slice(0,st.show).map(card).join('')+(pros.length>st.show?`<button class="more" onclick="st.show+=20;render()">Mostrar mais</button>`:'');hint='Prospects não têm data no CRM, então não têm relógio. Ordenados por valor.';}
  if(st.tab==='second'){
    hint='Deals perdidos há mais de 30 dias em contas onde ninguém tem deal aberto hoje no mesmo produto. No histórico, oportunidades reabertas após uma perda ganharam 61,7% — igual à média (61,5%). Perder não queima a conta.';
    list=`<table><thead><tr><th>Conta</th><th>Produto</th><th class="r">Valor</th><th>Perdido em</th><th></th></tr></thead><tbody>`+
      second.slice(0,st.show).map(s=>`<tr><td>${s.acc}</td><td>${s.prod}</td><td class="r">${usd(s.price)}</td><td>${s.lost} (${s.ago} dias)</td><td>${st.decisions[s.id]?`<span class="decided">✓ ${st.decisions[s.id]}</span>`:`<button class="btn" onclick="decide('${s.id}','Reabordagem planejada')">Reabordar</button>`}</td></tr>`).join('')+`</tbody></table>`+
      (second.length>st.show?`<button class="more" onclick="st.show+=20;render()">Mostrar mais</button>`:'');
  }
  return `<h1>Bom dia, ${first}.</h1>
  <p class="sub">${prof?`Seu perfil: <b>${prof.label}</b> · ${prof.vol} deals fechados/mês · ticket médio ${usd(prof.ticket)}`:''}</p>
  <div class="brief"><b>Sua semana em ${items.length} pontos</b><ol>${items.map(i=>`<li>${i}</li>`).join('')}</ol></div>
  <div class="kpis">
    <div class="kpi"><span>Deals vivos</span><b>${alive.length}</b><small>${usdk(alive.reduce((s,d)=>s+d.price,0))} em valor</small></div>
    <div class="kpi"><span>Valor esperado (90 dias)</span><b>${usdk(ev)}</b><small>valor × chance pela idade</small></div>
    <div class="kpi"><span>Zumbis para decidir</span><b>${zomb.length}</b><small>${usdk(zomb.reduce((s,d)=>s+d.price,0))} parados</small></div>
    <div class="kpi"><span>Conflitos de conta</span><b>${conf.length}</b><small>colega no mesmo produto</small></div>
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="${t[0]===st.tab?'on':''}" onclick="st.tab='${t[0]}';st.show=20;render()">${t[1]}<span class="n">${t[2]}</span></button>`).join('')}</div>
  ${hint?`<div class="hint">${hint}</div>`:''}${list}`;
}

function gerente(){
  const ags=team.filter(t=>(!st.of||t.regional_office===st.of)&&(!st.mg||t.manager===st.mg));
  const set=new Set(ags.map(a=>a.sales_agent));
  const ds=DATA.deals.filter(d=>set.has(d.ag));
  const open=ds.reduce((s,d)=>s+d.price,0);
  const alive=ds.filter(d=>d.stage==='Engaging'&&d.clock!=='zumbi');
  const zomb=ds.filter(d=>d.clock==='zumbi');
  const pros=ds.filter(d=>d.stage==='Prospecting');
  const evAlive=alive.reduce((s,d)=>s+d.ev,0);
  const naive=ds.filter(d=>d.stage==='Engaging').reduce((s,d)=>s+d.price,0)*0.62;
  const conf=ds.filter(d=>d.conf.length&&d.clock!=='zumbi').length;
  const noacc=ds.filter(d=>!d.acc).length;
  const rows=ags.map(a=>{
    const m=ds.filter(d=>d.ag===a.sales_agent); const al=m.filter(d=>d.stage==='Engaging'&&d.clock!=='zumbi'); const z=m.filter(d=>d.clock==='zumbi');
    const eng=m.filter(d=>d.stage==='Engaging').length; const p=DATA.prof[a.sales_agent];
    const top=al.sort((x,y)=>y.score-x.score)[0];
    return {a,m,al,z,eng,p,top,ev:al.reduce((s,d)=>s+d.ev,0),cf:m.filter(d=>d.conf.length&&d.clock!=='zumbi').length,pr:m.filter(d=>d.stage==='Prospecting').length};
  }).sort((x,y)=>y.ev-x.ev);
  const scope=st.mg?'Equipe de '+st.mg:st.of?'Escritório '+st.of:'Todas as equipes';
  return `<h1>${scope}</h1><p class="sub">${ags.length} vendedores · clique em um vendedor para abrir a visão dele</p>
  <div class="kpis">
    <div class="kpi"><span>Pipeline no CRM</span><b>${usdk(open)}</b><small>${ds.length} deals abertos</small></div>
    <div class="kpi"><span>Pipeline vivo</span><b>${usdk(alive.reduce((s,d)=>s+d.price,0)+pros.reduce((s,d)=>s+d.price,0))}</b><small>${alive.length} Engaging vivos (${usdk(alive.reduce((s,d)=>s+d.price,0))}) + ${pros.length} prospects</small></div>
    <div class="kpi"><span>Zumbis</span><b>${usdk(zomb.reduce((s,d)=>s+d.price,0))}</b><small>${zomb.length} deals · ${Math.round(100*zomb.length/Math.max(1,ds.filter(d=>d.stage==='Engaging').length))}% do Engaging</small></div>
    <div class="kpi"><span>Forecast 90 dias (Engaging)</span><b>${usdk(evAlive)}</b><small>o jeito ingênuo diria ${usdk(naive)}</small></div>
  </div>
  <table><thead><tr><th>Vendedor</th><th>Perfil</th><th class="r">Vivos</th><th class="r">Valor esperado</th><th class="r">Prospects</th><th>Zumbis</th><th class="r">Conflitos</th><th>Deal nº 1</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="click" onclick="st.role='vend';st.ag='${r.a.sales_agent}';st.tab='foco';document.querySelectorAll('#roles button').forEach(x=>x.classList.toggle('on',x.dataset.r==='vend'));render()">
    <td><b>${r.a.sales_agent}</b><div class="meta">${r.a.manager} · ${r.a.regional_office}</div></td>
    <td>${r.p?r.p.label:'<span class="meta">sem deals</span>'}${r.p?`<div class="meta">${r.p.vol}/mês · ticket ${usdk(r.p.ticket)}</div>`:''}</td>
    <td class="r">${r.al.length}</td><td class="r">${usdk(r.ev)}</td><td class="r">${r.pr||'–'}</td>
    <td>${r.eng?`<div style="display:flex;gap:8px;align-items:center"><div class="mini"><i style="width:${100*r.z.length/r.eng}%"></i></div>${r.z.length}</div>`:'–'}</td>
    <td class="r">${r.cf||'–'}</td>
    <td>${r.top?`${r.top.prod}<div class="meta">${r.top.acc||'sem conta'} · score ${r.top.score}</div>`:'–'}</td></tr>`).join('')}
  </tbody></table>
  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h3>Onde agir como gerente</h3>
      <ol style="margin:0;padding-left:18px">
        <li><b>${zomb.length} zumbis</b> inflam o pipeline em ${usdk(zomb.reduce((s,d)=>s+d.price,0))}. Peça a cada vendedor uma decisão (manter ou encerrar).</li>
        <li><b>${conf} deals vivos</b> têm outro vendedor na mesma conta e produto. Defina quem segue.</li>
        <li><b>${noacc} deals</b> estão sem conta vinculada no CRM.</li>
      </ol>
      <div class="note">Perfis usam o que se repete de um semestre para o outro: volume (correlação 0,95) e ticket (0,71). Conversão não se repete (0,35) — por isso não ranqueamos vendedor por win rate.</div>
    </div>
    <div class="panel"><h3>Forecast honesto</h3>
      <div class="hbar"><span>Ingênuo (pipeline × 62%)</span><div class="t"><i style="width:100%;background:#d6dbe3"></i></div><span>${usdk(naive)}</span></div>
      <div class="hbar me"><span>Ajustado pela idade</span><div class="t"><i style="width:${100*evAlive/naive}%"></i></div><span>${usdk(evAlive)}</span></div>
      <div class="note">No teste histórico, o ingênuo errou +83% a +190%; o ajustado errou +38% a +60%. Ainda superestima — use como referência, não como meta. Somado a isso, deals novos trazem ~US$ 1,5 mi/trimestre (empresa toda), o componente mais previsível.</div>
    </div>
  </div>`;
}

// ---------- por que confiar ----------
function confiar(){
  const strat=[['Nossa lógica (valor × idade)',2346145,1],['Só ordenar por valor',2090131,13],['"Baseline de IA" (valor × win rate vendedor/produto)',2085209,12],['Mais novos primeiro',1109819,0],['Aleatório (o "feeling")',874298,14],['Mais antigos primeiro',549131,53]];
  const ages=[['0–14 dias',43],['15–30',46],['31–60',49],['61–90',47],['91–120',36],['121–138',17],['mais de 138',0]];
  return `<h1>Por que confiar neste score</h1><p class="sub">Tudo aqui foi testado no histórico antes de entrar na ferramenta.</p>
  <div class="grid2">
  <div class="panel"><h3>Teste com "máquina do tempo"</h3>
    <div class="note" style="margin:0 0 8px">Voltamos a 4 datas de 2017 (jul–out). Cada vendedor focou nos seus 10 deals mais prioritários segundo cada estratégia. Quanto desse foco virou receita em 90 dias?</div>
    ${strat.map((s,i)=>`<div class="hbar ${i===0?'me':''}"><span>${s[0]}</span><div class="t"><i style="width:${100*s[1]/strat[0][1]}%"></i></div><span>${usdk(s[1])}</span></div>`).join('')}
    <div class="note">Foco em zumbis: nossa lógica 1% · aleatório 14% · mais antigos 53%. Vendedor a vendedor, mês a mês: melhor que "só valor" em 56 casos, igual em 51, pior em 13.</div>
  </div>
  <div class="panel"><h3>Chance de ganhar em 90 dias, pela idade do deal</h3>
    ${ages.map(a=>`<div class="hbar ${a[1]===0?'':''}"><span>${a[0]}</span><div class="t"><i style="width:${a[1]*2}%;background:${a[1]===0?'var(--zombie)':a[1]<20?'var(--hot)':a[1]<40?'var(--warn)':'var(--ok)'}"></i></div><span>${a[1]}%</span></div>`).join('')}
    <div class="note">Aprendido só com dados anteriores a cada data de teste. Este é o "momento" do score; o "valor" é o preço de tabela (os ganhos fecham a ±1% dele).</div>
  </div></div>
  <h2>O que testamos e deixamos de fora</h2>
  <table><thead><tr><th>Variável</th><th>Resultado</th></tr></thead><tbody>
  <tr><td>Win rate do vendedor, produto, conta, setor, região</td><td>Não prevê o resultado (AUC 0,48–0,51 em dados futuros)</td></tr>
  <tr><td>Modelo de machine learning com todas as variáveis</td><td>99,8% no passado, 50,5% no futuro — decorou, não aprendeu</td></tr>
  <tr><td>"Vendedor X é bom no produto Y"</td><td>Não se repete entre semestres (correlação −0,01)</td></tr>
  <tr><td>Histórico da conta, fase do vendedor, carga de deals, dia da semana</td><td>Sem sinal</td></tr>
  <tr><td>Fim de trimestre (80% de vitória no 3º mês vs 49% no 1º)</td><td>Forte, mas vale para todos os deals ao mesmo tempo → aviso de contexto, não peso no score</td></tr>
  </tbody></table>
  <h2>O que automatizamos e o que fica com as pessoas</h2>
  <table><thead><tr><th>A ferramenta faz</th><th>A pessoa decide</th><th>Por quê</th></tr></thead><tbody>
  <tr><td>Marca e explica deals zumbis</td><td>Vendedor mantém ou encerra</td><td>O CRM não registra atividade; o vendedor pode saber de algo que o sistema não vê</td></tr>
  <tr><td>Avisa conflito de conta</td><td>Vendedores/gerente combinam</td><td>5.149 casos em que dois vendedores ganharam o mesmo produto na mesma conta — bloquear mataria receita</td></tr>
  <tr><td>Lista a segunda chance</td><td>Vendedor escolhe reabordar</td><td>O motivo da perda não está no CRM</td></tr>
  <tr><td>Calcula o score com regras fixas</td><td>Vendedor pode discordar (fica registrado)</td><td>Auditável e explicável; as decisões viram o dado de atividade que hoje falta</td></tr>
  </tbody></table>`;
}

function render(){
  refreshFilters();
  $('#app').innerHTML = st.role==='vend'?vendedor():st.role==='ger'?gerente():confiar();
}
render();
</script>
